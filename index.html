<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Skill 水缸</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect x=%222%22 y=%223%22 width=%2212%22 height=%2211%22 rx=%221%22 fill=%22%231aa6b8%22/%3E%3C/svg%3E">
<style>
:root{
  --bg:#07090d; --panel:rgba(12,17,24,.78); --panel-b:rgba(150,190,220,.16); --ink:#e6edf3; --mute:#8b9bab; --dim:#5a6878;
  --teal:#3fd0d8; --warn:#ff7a2f; --hot:#ff3b26; --user:#45a8ff; --plugin:#b77bff; --project:#3ed08e; --command:#ffb22e; --summary:#f3d27a;
  --mono:"Cascadia Mono","Consolas","SFMono-Regular",ui-monospace,monospace;
  --sans:"Segoe UI","Noto Sans TC","Microsoft JhengHei","PingFang TC",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:13px/1.45 var(--sans);overflow:hidden}
#stage{position:fixed;inset:0}
#stage canvas{display:block;width:100%;height:100%;touch-action:none}
.panel{position:fixed;background:var(--panel);border:1px solid var(--panel-b);border-radius:12px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 10px 40px rgba(0,0,0,.35)}
.ph{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:8px;width:100%;padding:9px 12px;cursor:pointer;font-weight:600;letter-spacing:.02em;font-size:12px;color:var(--mute);text-transform:uppercase}
.ph:focus-visible{outline:2px solid var(--teal);outline-offset:-2px;border-radius:12px}
.ph .chev{margin-left:auto;transition:transform .2s}
.ph[aria-expanded=false] .chev{transform:rotate(-90deg)}
.pb{padding:0 12px 12px}
.ph[aria-expanded=false]+.pb{display:none}
#hud{left:14px;top:14px;width:318px;max-width:calc(100vw - 28px)}
#hud .title{font-size:15px;font-weight:650;color:var(--ink);line-height:1.3;margin:2px 0 2px;word-break:break-word;overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2}
#hud .title .proj{color:var(--teal);font-weight:600}#hud .title .sep{color:var(--dim);font-weight:400}
#hud .sid{font:11px var(--mono);color:var(--dim);word-break:break-all}
.gauge{display:flex;align-items:flex-end;gap:10px;margin:10px 0 6px}
.gauge .pct{font:600 40px/1 var(--mono);letter-spacing:-.02em;color:var(--teal);transition:color .4s}
.gauge .pct small{font-size:16px;color:var(--mute)}
.gauge .side{font:11px/1.35 var(--mono);color:var(--mute);padding-bottom:3px}
.bar{position:relative;height:8px;border-radius:5px;background:rgba(255,255,255,.07);overflow:visible;margin:4px 0 10px}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:linear-gradient(90deg,#1aa6b8,#3fd0d8);transition:width .6s,background .4s}
.bar b{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--hot);box-shadow:0 0 6px var(--hot)}
dl.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:0;font-size:12px}
dl.kv dt{color:var(--mute)} dl.kv dd{margin:0;text-align:right;font-family:var(--mono)}
.warn-on .gauge .pct{color:var(--warn)}
.hot-on .gauge .pct{color:var(--hot);animation:blink 0.8s steps(2) infinite}
@keyframes blink{50%{opacity:.45}}
#ctrl{right:14px;top:14px;width:300px;max-width:calc(100vw - 28px);max-height:calc(100vh - 150px);overflow:auto}
.row{display:flex;gap:6px;align-items:center;margin:7px 0;flex-wrap:wrap}
.row label{color:var(--mute);font-size:12px;min-width:56px}
select,input[type=number],button.b{font:12px var(--sans);color:var(--ink);background:rgba(255,255,255,.06);border:1px solid var(--panel-b);border-radius:7px;padding:5px 8px}
select{flex:1;min-width:0}
input[type=number]{width:90px}
button.b{cursor:pointer}
button.b:hover{background:rgba(255,255,255,.12)}
button.b.on{background:rgba(63,208,216,.18);border-color:rgba(63,208,216,.5)}
button.b:focus-visible,select:focus-visible{outline:2px solid var(--teal);outline-offset:1px}
.sw{display:flex;align-items:center;gap:6px;color:var(--ink);font-size:12px;cursor:pointer}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:8px;font-size:11px;color:var(--mute)}
.legend span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px;background:var(--c)}
.note{font-size:11px;color:var(--dim);margin-top:6px}
.badge{display:inline-block;font:600 10px var(--mono);padding:2px 6px;border-radius:5px;background:rgba(255,255,255,.08);color:var(--mute);margin-left:6px;vertical-align:2px}
.badge.live{background:rgba(62,208,142,.18);color:#5fe3a6}
.badge.demo{background:rgba(255,178,46,.18);color:#ffc35e}
.badge.err{background:rgba(255,59,38,.2);color:#ff8a7a}
#chartP{left:14px;right:14px;bottom:30px;height:auto}
#chart{display:block;width:100%;height:74px;cursor:crosshair}
#chartP .pb{padding:0 10px 8px}
#tip{position:fixed;z-index:20;pointer-events:none;width:300px;max-width:calc(100vw - 20px);background:rgba(10,14,20,.94);border:1px solid var(--panel-b);border-radius:10px;padding:10px 12px;display:none;box-shadow:0 12px 40px rgba(0,0,0,.5)}
#tip.pinned{pointer-events:auto}
#tip h4{margin:0 0 2px;font-size:14px}
#tip .cat{font:600 10px var(--mono);text-transform:uppercase;letter-spacing:.06em}
#tip p{margin:6px 0;color:#c7d2dc;font-size:12px;white-space:pre-wrap;word-break:break-word;max-height:150px;overflow:auto}
#tip dl{grid-template-columns:auto 1fr}
#toast{position:fixed;left:50%;top:16px;transform:translateX(-50%);background:rgba(255,59,38,.9);color:#fff;padding:6px 14px;border-radius:8px;font-weight:600;display:none;z-index:30}
#hud .navlink{display:inline-block;margin-top:6px;font-size:12px;color:var(--teal);text-decoration:none;border:1px solid rgba(63,208,216,.35);border-radius:7px;padding:3px 8px}
#hud .navlink:hover{background:rgba(63,208,216,.12)}#hud .navlink[hidden]{display:none}
#ver{position:fixed;right:12px;bottom:8px;font:10.5px var(--mono);color:var(--dim);z-index:5;pointer-events:none}
#hint{position:fixed;left:14px;bottom:8px;font-size:10.5px;color:var(--dim);z-index:5;pointer-events:none}
/* right column: control panel on top, deck (牌庫) fills the rest down to the chart */
#rightCol{position:fixed;right:14px;top:14px;bottom:var(--rcBottom,160px);width:320px;max-width:calc(100vw - 28px);display:flex;flex-direction:column;gap:10px;pointer-events:none;z-index:4}
#rightCol>.panel{position:relative;pointer-events:auto;inset:auto;width:auto;max-width:none}
#rightCol>#ctrl{flex:0 0 auto;max-height:46%;overflow:auto}
#deck{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
#deck>.ph[aria-expanded=false]{flex:0 0 auto}
#deck:has(>.ph[aria-expanded=false]){flex:0 0 auto}
#deck .ph{text-transform:none;color:var(--ink);font-size:13px;letter-spacing:0}
#deck .ph .dk-sub{font:600 11px var(--mono);color:var(--mute)}
#deck>.pb{display:flex;flex-direction:column;min-height:0;flex:1 1 auto;padding:0 10px 10px}
#deck>.ph[aria-expanded=false]+.pb{display:none}
.pile{position:relative;width:22px;height:28px;flex:0 0 22px}
.pile i{position:absolute;inset:0;border-radius:4px;background:linear-gradient(135deg,#c7b07a,#13233a 40%,#0a1220);border:1px solid #c7b07a;box-shadow:0 1px 2px rgba(0,0,0,.5)}
.pile i:nth-child(1){transform:translate(-3px,3px) rotate(-8deg);opacity:.6}
.pile i:nth-child(2){transform:translate(-1.5px,1.5px) rotate(-3deg);opacity:.8}
.dk-tools{display:flex;gap:6px;align-items:center;margin:0 0 6px}
.dk-tools input[type=search]{flex:1;min-width:0;font:12px var(--sans);color:var(--ink);background:rgba(255,255,255,.06);border:1px solid var(--panel-b);border-radius:7px;padding:5px 8px}
.dk-tools input[type=search]:focus-visible{outline:2px solid var(--teal);outline-offset:1px}
.dk-chips{display:flex;flex-wrap:nowrap;gap:4px;margin:0 0 6px;overflow-x:auto;scrollbar-width:none;flex:0 0 auto}
.dk-chips::-webkit-scrollbar{display:none}
.dk-chips button{all:unset;flex:0 0 auto;white-space:nowrap;cursor:pointer;font:600 10.5px var(--mono);padding:3px 7px;border-radius:999px;border:1px solid var(--panel-b);color:var(--mute);background:rgba(255,255,255,.04)}
.dk-chips button::before{content:"";display:inline-block;width:7px;height:7px;border-radius:2px;margin-right:4px;background:var(--c,#8b9bab);vertical-align:0}
.dk-chips button[aria-pressed=true]{color:var(--ink);border-color:rgba(63,208,216,.55);background:rgba(63,208,216,.14)}
.dk-chips button:focus-visible{outline:2px solid var(--teal)}
.dk-list{flex:1 1 auto;min-height:0;overflow:auto;overscroll-behavior:contain;padding-right:2px;-webkit-overflow-scrolling:touch}
.dk-group h5{position:sticky;top:0;z-index:1;margin:0;padding:5px 2px 4px;font:700 10.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--c);background:linear-gradient(rgba(12,17,24,.97) 70%,rgba(12,17,24,0))}
.dk-group h5 span{color:var(--dim);font-weight:600;margin-left:6px}
.dk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px;padding:2px 0 8px}
.dk-empty{color:var(--dim);font-size:12px;padding:12px 2px}
.mc[hidden],.dk-group[hidden]{display:none}
/* mini card: same language as the 3D card face (category gradient frame, dark body, colored ribbon) */
.mc{all:unset;box-sizing:border-box;position:relative;display:block;aspect-ratio:5/7;border-radius:7px;padding:2px;cursor:pointer;
  background:linear-gradient(135deg,var(--c),#f6f2e8 52%,var(--c2));box-shadow:0 2px 6px rgba(0,0,0,.45);transition:transform .15s,filter .3s,opacity .3s}
.mc>b{position:absolute;inset:2px;border-radius:5px;background:#10151c;overflow:hidden;display:flex;flex-direction:column}
.mc .rb{flex:0 0 auto;margin:3px 3px 0;height:11px;border-radius:3px;background:var(--c);font:800 7px/11px var(--sans);color:rgba(0,0,0,.72);padding:0 3px;letter-spacing:.03em;white-space:nowrap;overflow:hidden}
.mc .gl{flex:0 0 auto;margin:4px auto 2px;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font:800 11px/1 Georgia,serif;color:#fff;
  background:radial-gradient(circle,color-mix(in srgb,var(--c) 70%,transparent),transparent 72%);text-shadow:0 0 6px var(--c)}
.mc .nm{flex:1 1 auto;padding:0 4px 3px;font:600 9px/1.2 var(--sans);color:#e6edf3;overflow-wrap:anywhere;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;text-align:center}
.mc .n{position:absolute;top:-5px;right:-5px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:#f3d27a;color:#2a1d08;font:800 10px/17px var(--mono);text-align:center;box-shadow:0 1px 4px rgba(0,0,0,.6);display:none;z-index:2}
.mc.played>b{filter:saturate(.35) brightness(.55)}
.mc.played{background:linear-gradient(135deg,color-mix(in srgb,var(--c) 45%,#222),#5a5a52 52%,#222)}
.mc.played .n{display:block}
.mc.extra::after{content:"清單外";position:absolute;left:3px;bottom:-4px;font:700 8px var(--sans);background:#ff7a2f;color:#fff;border-radius:3px;padding:0 3px}
.mc.drawing{visibility:hidden}
.mc.slot{outline:1.5px dashed rgba(243,210,122,.8);outline-offset:-1px}
.mc:hover{transform:translateY(-3px)}
.mc:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.mc.fresh{animation:fresh 1.6s ease-out 2}
@keyframes fresh{0%{box-shadow:0 0 0 0 rgba(63,208,216,.9)}100%{box-shadow:0 0 0 10px rgba(63,208,216,0)}}
/* the card being drawn out of the deck (DOM half of the hand-off; the 3D card takes over where it ends) */
.ghost{position:fixed;z-index:25;pointer-events:none;margin:0;transform-origin:50% 50%;will-change:transform,opacity;box-shadow:0 10px 30px rgba(0,0,0,.6),0 0 18px color-mix(in srgb,var(--c) 70%,transparent)}
.ghost:hover{transform:none}
#deckTipNote{color:var(--dim);font-size:11px}
@media (max-width:900px),(max-height:560px){
  #hud{width:250px} #rightCol{width:260px}
  .gauge .pct{font-size:30px}
  #chartP{bottom:24px} #chart{height:56px}
  #hint{display:none}
}
@media (max-width:600px){
  /* phone: control panel above the chart; deck = collapsible bottom drawer (collapsed: handle + "牌庫 N 張") */
  #rightCol{display:contents}
  #rightCol>#ctrl{position:fixed;top:auto;bottom:168px;right:10px;left:10px;width:auto;max-height:50vh;overflow:auto}
  #hud{left:10px;top:10px;width:calc(100vw - 20px)}
  #chartP{left:10px;right:10px;bottom:64px}
  #rightCol>#deck{position:fixed;left:0;right:0;bottom:0;z-index:15;border-radius:16px 16px 0 0;border-bottom:0;padding-bottom:env(safe-area-inset-bottom)}
  #deck>.ph{padding:14px 16px 10px;position:relative}
  #deck>.ph::before{content:"";position:absolute;left:50%;top:5px;width:38px;height:4px;margin-left:-19px;border-radius:2px;background:rgba(255,255,255,.28)}
  #deck>.pb{height:44vh}
  #ver{bottom:50px}
  .dk-grid{grid-template-columns:repeat(auto-fill,minmax(68px,1fr))}
  body.deck-open #chartP,body.deck-open #ctrl{display:none}
  body.deck-open #ver{display:none}
}
</style>
</head>
<body>
<div id="stage"></div>

<section id="hud" class="panel" aria-label="Session 狀態">
  <button class="ph" aria-expanded="true" data-k="hud">Context 水缸 <span id="modeBadge" class="badge">…</span><span id="hMini" class="badge"></span><span class="chev">▾</span></button>
  <div class="pb">
    <div class="title" id="hTitle">載入中…</div>
    <div class="sid" id="hSid"></div>
    <a id="toTable" class="navlink" href="/table" title="全部活躍 session 一桌看（每個 session 一個缸）">全部 session 牌桌 ↗</a>
    <div class="gauge"><div class="pct" id="hPct">0<small>%</small></div><div class="side" id="hSide"></div></div>
    <div class="bar"><i id="hBar"></i><b id="hThr"></b></div>
    <dl class="kv">
      <dt>模型</dt><dd id="hModel">-</dd>
      <dt>已用 / 上限</dt><dd id="hUsed">-</dd>
      <dt>剩餘</dt><dd id="hLeft">-</dd>
      <dt>距自動壓縮</dt><dd id="hToCompact">-</dd>
      <dt>Skill 牌（水中 / 累計）</dt><dd id="hSkills">-</dd>
      <dt>壓縮次數</dt><dd id="hComp">0</dd>
    </dl>
  </div>
</section>

<div id="rightCol">
<section id="ctrl" class="panel" aria-label="控制">
  <button class="ph" aria-expanded="true" data-k="ctrl">控制 <span class="chev">▾</span></button>
  <div class="pb">
    <div id="liveCtl">
      <div class="row"><label for="selSess">Session</label><select id="selSess"></select></div>
      <div class="row"><label class="sw"><input type="checkbox" id="follow" checked> 跟隨最新（自動切到最近修改的 session）</label></div>
    </div>
    <div class="row"><label for="selLimit">上限</label><select id="selLimit"><option value="auto">自動</option><option value="200000">200K</option><option value="1000000">1M</option><option value="custom">自訂…</option></select><input type="number" id="limCustom" min="1000" step="1000" placeholder="tokens" hidden></div>
    <div class="row"><label for="selThr">壓縮線</label><select id="selThr"><option value="auto">自動（上限 − 33K）</option><option value="0.8">80%</option><option value="0.9">90%</option><option value="0.92">92%</option><option value="0.95">95%</option></select></div>
    <div class="row"><label>回放</label><button class="b" id="btnReplay">⟲ 從頭回放</button><select id="selSpeed" style="flex:0 0 70px"><option>1</option><option selected>2</option><option>4</option><option>8</option><option>16</option></select><button class="b" id="btnStop" hidden>■ 停</button></div>
    <div id="demoCtl">
      <div class="row"><label>示範</label><button class="b" id="dCard" title="從牌庫隨機抽一張丟進缸（也可以直接點牌庫裡的牌）">隨機抽一張</button><button class="b" id="dWater">加水 +6%</button><button class="b" id="dComp">觸發壓縮</button></div>
      <div class="row"><label></label><button class="b" id="dAuto">▶ 自動播放</button><button class="b" id="dReset">清空</button></div>
    </div>
    <div class="row"><label for="selQ">畫質</label><select id="selQ" title="自動：依實測 GPU 負載調整 fps 上限與解析度；高：原始解析度、60 fps；省電：30 fps、75% 解析度。網址 ?quality=low|high|auto 可覆寫"><option value="auto">自動</option><option value="high">高</option><option value="low">省電</option></select></div>
    <div class="note" id="perfNote"></div>
    <div class="legend"><span style="--c:var(--user)">user skill</span><span style="--c:var(--plugin)">plugin skill</span><span style="--c:var(--project)">project skill</span><span style="--c:var(--command)">slash command</span><span style="--c:#9aa7b4">built-in</span><span style="--c:var(--summary)">壓縮摘要卡</span></div>
    <div class="note" id="note"></div>
  </div>
</section>

<section id="deck" class="panel" aria-label="牌庫">
  <button class="ph" aria-expanded="true" aria-controls="deckBody" data-k="deck"><span class="pile" id="deckPile" aria-hidden="true"><i></i><i></i><i></i></span><span id="deckTitle">牌庫</span> <span class="dk-sub" id="deckSub"></span><span class="chev">▾</span></button>
  <div class="pb" id="deckBody">
    <div class="dk-tools"><input type="search" id="deckQ" placeholder="搜尋 skill 名稱或描述…" aria-label="搜尋牌庫" autocomplete="off"><label class="sw" title="只顯示已出過的牌"><input type="checkbox" id="deckPlayed"> 已出</label></div>
    <div class="dk-chips" id="deckChips" role="group" aria-label="類別篩選"></div>
    <div class="dk-list" id="deckList"></div>
    <div class="note" id="deckNote"></div>
  </div>
</section>
</div>

<section id="chartP" class="panel" aria-label="Context 曲線">
  <button class="ph" aria-expanded="true" data-k="chart">Context 曲線 · 點一下從該時刻開始回放 <span class="chev">▾</span></button>
  <div class="pb"><canvas id="chart"></canvas></div>
</section>

<div id="tip" role="tooltip"></div>
<div id="toast">⚠ 自動壓縮</div>
<div id="hint">拖曳旋轉 · 滾輪縮放 · 滑過/點擊卡牌看詳情</div>
<div id="ver">skill-tank build 2026-10-02 r5</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.172.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.172.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const VERSION = 'skill-tank build 2026-10-02 r5';
const Q = new URLSearchParams(location.search);
const DEMO_ONLY = !!window.SKILL_TANK_DEMO_ONLY;
const $ = (id) => document.getElementById(id);
const lsGet = (k, d) => { try { const v = localStorage.getItem('skilltank.' + k); return v == null ? d : v; } catch { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem('skilltank.' + k, v); } catch {} };
const fmtK = (n) => n == null || isNaN(n) ? '-' : Math.abs(n) >= 1e6 ? (n / 1e6).toFixed(2) + 'M' : Math.abs(n) >= 1000 ? (n / 1000).toFixed(1) + 'K' : String(Math.round(n));
const fmtTime = (t) => { if (!t) return '-'; const d = new Date(t); return isNaN(d) ? '-' : d.toLocaleString('zh-TW', { hour12: false, month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit' }); };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;

  P.pixelRatio = () => Math.min(devicePixelRatio || 1, preset().prCap) * step().scale;
  function apply() {
    const pr = P.pixelRatio();
    if (Math.abs(o.renderer.getPixelRatio() - pr) > 1e-6) { o.renderer.setPixelRatio(pr); if (o.composer) o.composer.setPixelRatio(pr); o.resize(); }
    if ('transmissionResolutionScale' in o.renderer) o.renderer.transmissionResolutionScale = preset().tScale;
    o.onLite && o.onLite(P.lite());
    o.onChange && o.onChange(P);
  }
  P.kick = () => { lastActive = performance.now(); };
  P.setMode = (m, persist = true) => {
    if (!valid(m)) return; P.mode = m; P.level = 0; goodWins = 0; lastChange = performance.now(); P.fromUrl = false;
    if (persist) { try { localStorage.setItem(KEY, m); } catch {} }
    apply(); P.kick();
  };
  P.info = () => { const s = step(); return { mode: P.mode, name: NAMES[P.mode], fromUrl: P.fromUrl, level: P.level, scale: s.scale, pixelRatio: o.renderer.getPixelRatio(), cap: s.cap, idle: s.idle, deep: s.deep, state: P.state, fps: +P.fps.toFixed(1), gpuMs: P.gpuMs == null ? null : +P.gpuMs.toFixed(1), busy: P.busy == null ? null : +P.busy.toFixed(2), renders: P.renders, timer: !!tq }; };
  function govern(now) {
    if (now - win.t0 < 2000) return;
    const ms = now - win.t0; P.fps = win.n * 1000 / ms; P.gpuMs = win.gn ? win.gpu / win.gn : null; P.busy = win.gn ? win.gpu / ms : null;
    if (P.mode === 'auto' && now - lastChange > 4000 && win.n >= 6) {
      const l = preset().ladder, s = step(); let down = false, up = false;
      if (P.gpuMs != null) {
        down = P.gpuMs * s.cap / 1000 > BUDGET_DOWN;
        const b = l[P.level - 1]; up = !!b && P.gpuMs * (b.scale / s.scale) ** 2 * b.cap / 1000 < BUDGET_UP;
      } else down = win.active / win.n > 0.9 && P.fps < s.cap * 0.75; // no timer queries: only step down when animation can't hold the cap
      goodWins = up ? goodWins + 1 : 0;
      if (down && P.level < l.length - 1) { P.level++; lastChange = now; apply(); }
      else if (up && goodWins >= 3) { P.level--; goodWins = 0; lastChange = now; apply(); }
    }
    o.onStats && o.onStats(P.info());
    win = { t0: now, n: 0, gpu: 0, gn: 0, active: 0 };
  }
  // one rendered frame (GPU time measured with a timer query when the browser exposes one)
  P.render = () => {
    let q = null; if (tq && pend.length < 6) { q = gl.createQuery(); gl.beginQuery(tq.TIME_ELAPSED_EXT, q); }
    o.draw(); P.renders++; win.n++; if (P.state === 'active') win.active++;
    if (q) { gl.endQuery(tq.TIME_ELAPSED_EXT); pend.push(q); }
    while (pend.length && gl.getQueryParameter(pend[0], gl.QUERY_RESULT_AVAILABLE)) {
      const x = pend.shift(); if (!gl.getParameter(tq.GPU_DISJOINT_EXT)) { win.gpu += gl.getQueryParameter(x, gl.QUERY_RESULT) / 1e6; win.gn++; } gl.deleteQuery(x);
    }
  };
  function run(now) {
    raf = 0; if (document.hidden) return; raf = requestAnimationFrame(run);
    if (o.busy()) lastActive = now;
    const idleFor = now - lastActive, s = step();
    P.state = idleFor < 1500 ? 'active' : idleFor < 30000 ? 'idle' : 'deep';
    const interval = 1000 / (P.state === 'active' ? s.cap : P.state === 'idle' ? s.idle : s.deep);
    acc = Math.min(acc + (lastTick ? now - lastTick : interval), interval * 2); lastTick = now;
    if (acc < interval - 2) { govern(now); return; }
    acc = Math.max(0, acc - interval);
    const dt = lastRender ? Math.min(0.1, (now - lastRender) / 1000) : 1 / 60; lastRender = now;
    fn(dt, now); govern(now);
  }
  P.loop = (f) => { fn = f; apply(); if (!raf) raf = requestAnimationFrame(run); };
  document.addEventListener('visibilitychange', () => { if (document.hidden) return; lastTick = lastRender = 0; acc = 0; P.kick(); if (!raf && fn) raf = requestAnimationFrame(run); });
  for (const ev of ['pointerdown', 'wheel', 'keydown']) addEventListener(ev, P.kick, { passive: true, capture: true });
  if (o.controls) o.controls.addEventListener('change', P.kick);
  return P;
}

/* ---------- composer / resize / loop ---------- */
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(256, 256), 0.55, 0.45, 2.0); composer.addPass(bloom);
composer.addPass(new OutputPass());
function resize() { const w = stage.clientWidth || innerWidth, h = stage.clientHeight || innerHeight; renderer.setSize(w, h, false); composer.setSize(w, h); camera.aspect = w / h; camera.updateProjectionMatrix(); if (!userMoved) { camera.position.copy(controls.target).addScaledVector(camOffset, Math.max(1, 1.55 / camera.aspect) ** 0.85); } pMat.uniforms.uScale.value = h * 1.5 * renderer.getPixelRatio() / Math.min(devicePixelRatio, 2); drawChart(); if (perf) perf.kick(); }
new ResizeObserver(resize).observe(stage); resize();

// something on screen still moves → render at the active cap (else idle / deep-idle rate; ambient waves keep going)
function sceneBusy() {
  if (V.compactAnim || replay || pAlive || Math.abs(V.target - V.level) > 4e-4) return true;
  for (const r of ripples) if (clock - r.t0 < 4) return true;
  for (const v of V.cards.values()) if (v.state !== 'rest') return true;
  return false;
}
function showPerf(i) {
  const el = $('perfNote'); if (!el) return;
  el.textContent = `畫質 ${i.name}${i.fromUrl ? '（網址指定）' : ''} · 解析度 ${Math.round(i.pixelRatio * 100)}% · 上限 ${i.cap}／靜止 ${i.idle} fps · 實測 ${i.fps.toFixed(0)} fps${i.gpuMs != null ? ` · GPU ${i.gpuMs.toFixed(1)} ms/幀` : ''}`;
}
let hudT = 0, frames = 0;
// 自動/省電 "lite": the wooden table (largest surface, drawn again in the transmission pass) loses its clearcoat layer,
// and the glass walls are drawn single-sided with the opacity of the two layers DoubleSide used to stack (1 − 0.9²).
const tableFull = table.material; let tableLite = null;
function applyLite(on) {
  if (on && !tableLite) tableLite = new THREE.MeshStandardMaterial({ map: tableFull.map, roughness: 0.44 });
  table.material = on ? tableLite : tableFull;
  glassMat.side = on ? THREE.FrontSide : THREE.DoubleSide; glassMat.opacity = on ? 0.19 : 0.1; glassMat.needsUpdate = true;
}
perf = makePerf({ renderer, composer, controls, resize, draw: () => composer.render(), busy: sceneBusy, onStats: showPerf, onLite: applyLite });
$('selQ').value = perf.mode; $('selQ').onchange = (e) => perf.setMode(e.target.value);
function frame(dt) {
  clock += dt; frames++;
  stepReplay(dt); stepCompact(dt); stepWater(dt); stepCards(dt); stepParticles(dt);
  controls.update(); renderer.shadowMap.needsUpdate = perf.state === 'active' || frames < 3; perf.render();
  hudT += dt; if (hudT > 0.2) { hudT = 0; updateHud(); if (replay) drawChart(); }
}
perf.loop(frame);

/* ---------- test hooks ---------- */
window.__tank = {
  M, V, version: VERSION,
  stats: () => ({ skillCards: M.cards.filter((c) => c.kind === 'skill').length, aliveSkill: M.cards.filter((c) => c.alive && c.kind === 'skill').length, summaries: M.cards.filter((c) => c.kind === 'summary' && c.alive).length, meshes: V.cards.size, meshSkill: [...V.cards.values()].filter((v) => v.card.kind === 'skill').length, level: V.level, target: V.target, ctx: M.ctx, limit: effLimit(), threshold: effThreshold(), compactions: M.compactions, events: M.events.length, applied: M.applied, compactAnim: !!V.compactAnim, frames, mode: M.mode, session: M.session && M.session.id, perf: perf.info() }),
  perf,
  demo: { card: demoCard, water: demoWater, compact: demoCompact, auto: setAuto }, startReplay, stopReplay, seekTo, connect,
  tankRect: () => { const xs = [], ys = []; for (const x of [-1, 1]) for (const y of [0, RIM]) for (const z of [-1, 1]) { const q = worldToScreen(new THREE.Vector3(x * (IW / 2 + G), y, z * (ID / 2 + G))); xs.push(q.x); ys.push(q.y); } return { left: Math.min(...xs), right: Math.max(...xs), top: Math.min(...ys), bottom: Math.max(...ys) }; },
  deck: { D, lastDraw: () => lastDraw, rect: (name) => { const el = D.els.get(name); if (!el) return null; const r = el.getBoundingClientRect(); return { x: r.left, y: r.top, w: r.width, h: r.height, played: el.classList.contains('played'), drawing: el.classList.contains('drawing'), count: el.querySelector('.n').textContent }; }, stats: () => ({ deck: D.cards.length - D.cards.filter((c) => c.extra).length, extras: D.cards.filter((c) => c.extra).length, plays: D.plays, playedSlots: [...D.els.values()].filter((e) => e.classList.contains('played')).length, source: D.source, open: deckOpen(), ghosts: document.querySelectorAll('.ghost').length }) },
};

/* ---------- boot ---------- */
drawLabels();
(async () => {
  if (DEMO_ONLY || Q.has('demo') || location.protocol === 'file:') { startDemo(!Q.has('still') && (DEMO_ONLY || Q.has('auto'))); return; }
  try {
    sessions = await fetchSessions(); M.mode = 'live';
    const want = Q.get('session');
    if (want) $('follow').checked = false;
    fillSessionSelect(); connect(want || (sessions.find((s) => !s.test) || sessions[0] || {}).id);
    $('demoCtl').hidden = !Q.has('demoButtons');
    followTimer = setInterval(() => followCheck(false), 4000);
  } catch (err) { console.warn('no server, demo mode', err); startDemo(true); }
})();
</script>
